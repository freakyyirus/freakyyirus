name: Generate Rainbow Contribution Grid

on:
  schedule:
    - cron: "0 0 * *Status"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Create Rainbow Grid
        run: |
          mkdir -p output
          cat > output/rainbow-grid.svg << 'EOF'
          <svg width="100%" height="200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#ff006e;stop-opacity:1" />
                <stop offset="20%" style="stop-color:#8338ec;stop-opacity:1" />
                <stop offset="40%" style="stop-color:#3a86ff;stop-opacity:1" />
                <stop offset="60%" style="stop-color:#06ffa5;stop-opacity:1" />
                <stop offset="80%" style="stop-color:#ffbe0b;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#ff006e;stop-opacity:1" />
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                <feMerge>
                  <feMergeNode in="coloredBlur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>
            
            <!-- Animated background -->
            <rect width="100%" height="100%" fill="#0d1117" rx="10"/>
            
            <!-- Rainbow wave -->
            <path d="M0,100 Q250,50 500,100 T1000,100" fill="none" stroke="url(#rainbow)" stroke-width="4" filter="url(#glow)">
              <animate attributeName="d" 
                values="M0,100 Q250,50 500,100 T1000,100;
                        M0,100 Q250,150 500,100 T1000,100;
                        M0,100 Q250,50 500,100 T1000,100" 
                dur="4s" 
                repeatCount="indefinite"/>
            </path>
            
            <!-- Pulsing dots -->
            <circle cx="100" cy="100" r="8" fill="#ff006e" filter="url(#glow)">
              <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
            </circle>
            <circle cx="300" cy="100" r="8" fill="#8338ec" filter="url(#glow)">
              <animate attributeName="r" values="8;12;8" dur="2s" begin="0.4s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="1;0.5;1" dur="2s" begin="0.4s" repeatCount="indefinite"/>
            </circle>
            <circle cx="500" cy="100" r="8" fill="#3a86ff" filter="url(#glow)">
              <animate attributeName="r" values="8;12;8" dur="2s" begin="0.8s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="1;0.5;1" dur="2s" begin="0.8s" repeatCount="indefinite"/>
            </circle>
            <circle cx="700" cy="100" r="8" fill="#06ffa5" filter="url(#glow)">
              <animate attributeName="r" values="8;12;8" dur="2s" begin="1.2s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="1;0.5;1" dur="2s" begin="1.2s" repeatCount="indefinite"/>
            </circle>
            <circle cx="900" cy="100" r="8" fill="#ffbe0b" filter="url(#glow)">
              <animate attributeName="r" values="8;12;8" dur="2s" begin="1.6s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="1;0.5;1" dur="2s" begin="1.6s" repeatCount="indefinite"/>
            </circle>
            
            <text x="50%" y="160" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16" font-weight="bold">
              Living Code • Breathing Colors • Growing Ideas
              <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
            </text>
          </svg>
          EOF
      
      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: output

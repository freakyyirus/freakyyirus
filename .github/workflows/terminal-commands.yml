name: Terminal Command Handler

on:
  issues:
    types: [opened]

jobs:
  execute_hack:
    if: contains(github.event.issue.labels.*.name, 'hack-system')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Update Hackers List
        uses: python_script
        run: |
          import re
          
          user = "${{ github.event.issue.user.login }}"
          readme_path = "README.md"
          
          with open(readme_path, "r") as f:
              content = f.read()
              
          # Append user to a specific section
          marker = "<!-- 💻 HACKER_LIST -->"
          new_entry = f"<li>👾 <b>{user}</b> accessed the mainframe.</li>\n"
          
          if marker in content:
              new_content = content.replace(marker, marker + "\n" + new_entry)
              
              with open(readme_path, "w") as f:
                  f.write(new_content)
                  
      - name: Commit Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "System override by ${{ github.event.issue.user.login }}"
          git push
          
      - name: Close Issue
        uses: peter-evans/close-issue@v3
        with:
          comment: "✅ **ACCESS GRANTED.** System updated. Welcome to the mainframe, ${{ github.event.issue.user.login }}."

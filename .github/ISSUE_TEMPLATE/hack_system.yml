name: Hack System
description: Execute a system override command on the profile.
title: "[SYSTEM_OVERRIDE]: <YOUR_USERNAME>"
labels: ["hack-system"]
body:
  - type: markdown
    attributes:
      value: |
        ## ⚠️ SYSTEM WARNING
        You are about to execute a system override on **freakyyirus**'s profile.
        
        ### Protocol:
        1. Replace `<YOUR_USERNAME>` in the title with your GitHub username.
        2. Click **Submit new issue**.
        3. Watch the profile "Known Hackers" list update automatically!
        
  - type: checkboxes
    id: terms
    attributes:
      label: Protocol Agreement
      options:
        - label: I agree to join the elite hacker list.
          required: true
